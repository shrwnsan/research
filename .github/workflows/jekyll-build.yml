name: Jekyll Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Pinned: ubuntu-26.04 runners have no ruby-builder build for Ruby 3.3.4
    # (setup-ruby 404s in the Setup step). Revisit 24.04→26.04 together with a
    # deliberate Ruby bump, not silently via ubuntu-latest.
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Ruby 3.3.4
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.4'
        bundler-cache: true

    - name: Build Jekyll site
      run: bundle exec jekyll build

    - name: Verify build artifacts
      run: |
        echo "Checking if _site directory was created..."
        test -d _site && echo "✅ _site directory exists"
        test -f _site/index.html && echo "✅ index.html was generated"
        echo "📊 Site build successful!"